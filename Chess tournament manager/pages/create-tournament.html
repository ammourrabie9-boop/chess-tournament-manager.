<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Tournament - Chess Tournament Manager</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tournament.css">

</head>

<body>

    <main class="tournament-page">


        <!-- HEADER -->

        <header class="tournament-header">

            <div>

                <h1>
                    Create Tournament
                </h1>

                <p>
                    Set up your chess tournament.
                </p>

            </div>


            <button
                type="button"
                id="backButton"
            >
                Back
            </button>

        </header>



        <!-- FORM -->

        <section class="tournament-form-container">

            <form id="tournamentForm">


                <!-- BASIC INFORMATION -->

                <div class="form-section">

                    <h2>
                        Basic Information
                    </h2>


                    <label for="tournamentName">
                        Tournament Name
                    </label>

                    <input
                        type="text"
                        id="tournamentName"
                        placeholder="Enter tournament name"
                        required
                    >


                    <label for="tournamentType">
                        Tournament Type
                    </label>

                    <select
                        id="tournamentType"
                        required
                    >

                        <option value="">
                            Select tournament type
                        </option>

                        <option value="swiss">
                            Swiss System
                        </option>

                        <option value="round-robin">
                            Round Robin
                        </option>

                        <option value="double-round-robin">
                            Double Round Robin
                        </option>

                        <option value="knockout">
                            Knockout
                        </option>

                        <option value="double-elimination">
                            Double Elimination
                        </option>

                        <option value="team">
                            Team Tournament
                        </option>

                        <option value="team-swiss">
                            Team Swiss
                        </option>

                        <option value="team-round-robin">
                            Team Round Robin
                        </option>

                        <option value="match">
                            Match
                        </option>

                        <option value="scheveningen">
                            Scheveningen
                        </option>

                        <option value="double-swiss">
                            Double-Swiss
                        </option>

                        <option value="accelerated-swiss">
                            Accelerated Swiss
                        </option>

                        <option value="dutch">
                            FIDE Dutch System
                        </option>

                        <option value="dubov">
                            Dubov System
                        </option>

                        <option value="burstein">
                            Burstein System
                        </option>

                        <option value="lim">
                            Lim System
                        </option>

                        <option value="hybrid">
                            Hybrid / Multi-Stage
                        </option>

                        <option value="custom">
                            Custom Tournament
                        </option>

                    </select>

                </div>



                <!-- PLAYERS -->

                <div class="form-section">

                    <h2>
                        Players
                    </h2>


                    <p>
                        Add the players who will participate in this tournament.
                    </p>


                    <!-- INPUT AREA -->

                    <div class="player-input-area">


                        <label for="playerName">
                            Player Name
                        </label>

                        <input
                            type="text"
                            id="playerName"
                            placeholder="Enter player name"
                        >


                        <label for="playerElo">
                            Elo
                        </label>

                        <input
                            type="number"
                            id="playerElo"
                            placeholder="Enter Elo"
                            min="0"
                        >


                        <label for="playerId">
                            ID (Optional)
                        </label>

                        <input
                            type="text"
                            id="playerId"
                            placeholder="Enter player ID"
                        >


                        <button
                            type="button"
                            id="addPlayerButton"
                        >
                            + Add Player
                        </button>

                    </div>



                    <!-- ADDED PLAYERS -->

                    <div id="playersList">
                    </div>


                    <p id="playerCountDisplay">
                        Players: 0
                    </p>

                </div>



                <!-- CONTINUE -->

                <button
                    type="submit"
                    id="continueButton"
                >
                    Continue
                </button>


            </form>

        </section>


    </main>



    <script src="../js/tournament.js"></script>

</body>

</html>
